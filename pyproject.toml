[project]
name = "carma-jax"
version = "0.1.0"
description = "JAX port of CARMA bin microphysics model"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.20", "jaxlib>=0.4.20", "diffrax>=0.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist", "numpy>=1.24"]
gpu = ["jax[cuda12]>=0.4.20"]
tpu = ["jax[tpu]>=0.4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carma", "src/carma_diffrax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "gpu: tests requiring GPU backend",
    "integration: tests comparing against Fortran benchmarks",
    "diffrax: tests for the carma_diffrax parallel solver package",
]
